```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Braniomngima Hospital | Oyugis, Kenya</title>

    <meta name="description"
          content="Braniomngima Hospital is located along the Kisii–Kisumu Highway in Oyugis, opposite Equity Bank.">

</head>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #26332f;
            line-height: 1.6;
            background: #ffffff;
        }

        a {
            text-decoration: none;
        }

        /* TOP BAR */
        .top-bar {
            background: #087f5b;
            color: white;
            padding: 9px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        /* NAVIGATION */
        header {
            background: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5eeeb;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #e8f5f0;
            color: #087f5b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .hospital-name {
            font-size: 21px;
            font-weight: 700;
            color: #075c43;
        }

        .hospital-location {
            font-size: 12px;
            color: #66756f;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #344840;
            font-weight: 600;
            font-size: 15px;
        }

        nav a:hover {
            color: #087f5b;
        }

        /* HERO */
        .hero {
            min-height: 600px;
            background:
                linear-gradient(rgba(7, 92, 67, 0.68), rgba(7, 92, 67, 0.68)),
                url("images/hospital-hero.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 70px 6%;
            color: white;
        }

        .hero-content {
            max-width: 720px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .hero h1 {
            font-size: clamp(40px, 6vw, 68px);
            line-height: 1.05;
            margin-bottom: 22px;
        }

        .hero p {
            font-size: 20px;
            max-width: 650px;
            margin-bottom: 30px;
            color: #eefaf6;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 23px;
            border-radius: 7px;
            font-weight: 700;
        }

        .btn-primary {
            background: white;
            color: #087f5b;
        }

        .btn-secondary {
            border: 1px solid rgba(255,255,255,0.75);
            color: white;
        }

        /* GENERAL */
        section {
            padding: 75px 6%;
        }

        .section-heading {
            max-width: 700px;
            margin-bottom: 40px;
        }

        .section-heading span {
            color: #087f5b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        .section-heading h2 {
            font-size: 38px;
            margin: 8px 0 12px;
            color: #18352c;
        }

        .section-heading p {
            color: #66756f;
        }

        /* INTRO */
        .intro {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .intro-image {
            min-height: 380px;
            border-radius: 16px;
            background: #e8f5f0 url("images/hospital-about.jpg") center/cover;
        }

        .intro-text h2 {
            font-size: 38px;
            color: #18352c;
            margin-bottom: 18px;
        }

        .intro-text p {
            color: #66756f;
            margin-bottom: 18px;
        }

        /* TRUST */
        .trust {
            background: #f4faf8;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .trust-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e0ebe7;
        }

        .trust-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .trust-card h3 {
            color: #18352c;
            margin-bottom: 8px;
        }

        .trust-card p {
            color: #66756f;
            font-size: 15px;
        }

        /* SHA */
        .sha-section {
            background: white;
            text-align: center;
        }

        .sha-box {
            max-width: 850px;
            margin: auto;
            border: 1px solid #d9e9e3;
            border-radius: 16px;
            padding: 35px;
            background: #f8fcfa;
        }

        .sha-logo-placeholder {
            width: 110px;
            height: 70px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f5f0;
            color: #087f5b;
            border-radius: 10px;
            font-weight: bold;
        }

        .sha-box h2 {
            color: #18352c;
            margin-bottom: 10px;
        }

        .sha-box p {
            color: #66756f;
        }

        /* LOCATION */
        .location {
            background: #087f5b;
            color: white;
            text-align: center;
        }

        .location h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .location p {
            color: #e5f5ef;
            margin-bottom: 22px;
        }

        /* FOOTER */
        footer {
            background: #07513d;
            color: white;
            padding: 45px 6% 25px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 35px;
        }

        footer h3 {
            margin-bottom: 12px;
        }

        footer p,
        footer a {
            color: #c4d9d2;
            font-size: 14px;
        }

        footer a:hover {
            color: white;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.18);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #a8c3ba;
        }

        .jompo-link {
            color: #c4d9d2;
            font-weight: 700;
        }

        .jompo-link:hover {
            color: white;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .top-bar {
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                min-height: 520px;
                text-align: center;
                justify-content: center;
            }

            .hero-buttons {
                justify-content: center;
            }

            .intro,
            .trust-grid,
            .footer-grid {
                grid-template-columns: 1fr;
            }

            .section-heading h2,
            .intro-text h2 {
                font-size: 30px;
            }
        }
    </style>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <span>Braniomngima Hospital — Oyugis, Kenya</span>
        <span>SHA Accredited</span>
    </div>

    <!-- NAVIGATION -->
    <header>

        <div class="logo-area">
            <div class="logo-placeholder">BH</div>

            <div>
                <div class="hospital-name">Braniomngima Hospital</div>
                <div class="hospital-location">
                    Oyugis • Kisii–Kisumu Highway
                </div>
            </div>
        </div>
